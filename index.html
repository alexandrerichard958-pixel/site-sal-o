
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento do Salão</title>

    <style>
        body {
            background-color: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        h1, h2 {
            color: gold;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            border: 1px solid gold;
            border-radius: 15px;
            background-color: #161616;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid gold;
            border-radius: 6px;
            background-color: #222;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background-color: gold;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #e6b800;
        }

        #mensagem {
            margin-top: 20px;
            color: gold;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <h1>✨ Nosso Salão ✨</h1>
    <p>Beleza, estilo e cuidado com você.</p>

    <div class="container">
        <h2>Agende seu horário</h2>

        <form id="formAgendamento">
            <label for="nome">Seu nome:</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="data">Escolha a data:</label>
            <input
                type="date"
                id="data"
                required
            >

            <label for="horario">Escolha o horário:</label>
            <input
                type="time"
                id="horario"
                required
            >

            <button type="submit">
                Confirmar agendamento
            </button>
        </form>

        <div id="mensagem" role="status"></div>
    </div>

    <script>
        document.getElementById("formAgendamento")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                let nome = document.getElementById("nome").value;
                let data = document.getElementById("data").value;
                let horario = document.getElementById("horario").value;

                document.getElementById("mensagem").innerHTML =
                    "Agendamento solicitado com sucesso!<br>" +
                    "Nome: " + nome.replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;") + "<br>" +
                    "Data: " + data + "<br>" +
                    "Horário: " + horario;
            });
    </script>

</body>
</html>
